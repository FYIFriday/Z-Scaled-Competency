<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cumulative Competency is a Sneak — Average Value Booth</title>
<meta name="description" content="An interactive carnival booth demonstrating expected value: six spins of a five-way wheel (-1 to +3), scored on their average." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Baloo+2:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --gold: #ffce3a;
    --red: #d4232c;
    --deep-red: #8c1015;
    --tent-a: #b3222c;
    --tent-b: #f4e3c1;
    --green: #2fae5b;
    --orange: #ff8c1a;
    --blue: #2f7fe0;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: 'Baloo 2', sans-serif;
    background: #241016;
    color: #2b1210;
    overflow-x: hidden;
  }

  .carnival-bg {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.5rem 1rem 4rem;
    background:
      radial-gradient(circle at 50% 0%, rgba(255,255,255,0.08), transparent 60%),
      repeating-linear-gradient(
        90deg,
        var(--tent-a) 0px, var(--tent-a) 60px,
        var(--tent-b) 60px, var(--tent-b) 120px
      );
    background-color: var(--tent-a);
    position: relative;
  }

  .lights {
    width: 100%;
    max-width: 720px;
    display: flex;
    justify-content: space-between;
    padding: 0 0.5rem;
    margin-bottom: -0.5rem;
  }

  .lights span {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 10px 3px rgba(255, 206, 58, 0.85);
    animation: twinkle 1.4s ease-in-out infinite;
  }

  .lights span:nth-child(odd) { animation-delay: 0.4s; background: #ff6b6b; box-shadow: 0 0 10px 3px rgba(255,107,107,0.85); }
  .lights span:nth-child(3n) { animation-delay: 0.8s; background: #57c1ff; box-shadow: 0 0 10px 3px rgba(87,193,255,0.85); }

  @keyframes twinkle {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.35; transform: scale(0.75); }
  }

  .sign {
    background: linear-gradient(160deg, #fff7e6, #ffe6a8);
    border: 8px solid var(--deep-red);
    border-radius: 14px;
    padding: 1.4rem 2rem 1.6rem;
    text-align: center;
    max-width: 720px;
    width: 100%;
    box-shadow: 0 10px 0 rgba(0,0,0,0.25), 0 18px 30px rgba(0,0,0,0.35);
    position: relative;
    margin-top: 0.5rem;
  }

  .sign::before, .sign::after {
    content: "★";
    position: absolute;
    top: 10px;
    color: var(--red);
    font-size: 1.2rem;
  }
  .sign::before { left: 14px; }
  .sign::after { right: 14px; }

  .sign h1 {
    font-family: 'Bangers', cursive;
    letter-spacing: 1.5px;
    font-size: clamp(1.6rem, 4.6vw, 2.7rem);
    color: var(--red);
    text-shadow: 2px 2px 0 #fff, 4px 4px 0 rgba(0,0,0,0.15);
    margin: 0.2rem 0;
    line-height: 1.15;
  }

  .sign p.subtitle {
    font-weight: 700;
    color: var(--deep-red);
    font-size: clamp(0.9rem, 2vw, 1.15rem);
    margin: 0.3rem 0 0;
  }

  .booth {
    margin-top: 2.5rem;
    background: linear-gradient(180deg, #4a2a12, #2f1a0b);
    border: 6px solid #1c0f05;
    border-radius: 16px;
    padding: 2.5rem 1.5rem 1.2rem;
    max-width: 900px;
    width: 100%;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.5), 0 12px 24px rgba(0,0,0,0.4);
  }

  .targets-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 1.6rem 1.2rem;
  }

  .target {
    position: relative;
    width: 120px;
    height: 170px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    cursor: pointer;
    user-select: none;
  }

  .target.resolved { cursor: default; }

  .target-face {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: repeating-radial-gradient(
      circle,
      #f4e3c1 0px, #f4e3c1 11px,
      var(--red) 11px, var(--red) 22px,
      #f4e3c1 22px, #f4e3c1 33px,
      var(--red) 33px, var(--red) 44px,
      #17263a 44px, #17263a 55px
    );
    border: 4px solid #17263a;
    box-shadow: 0 6px 10px rgba(0,0,0,0.4);
    position: relative;
    z-index: 2;
    transition: transform 0.15s ease;
  }

  .stand {
    width: 18px;
    height: 46px;
    background: linear-gradient(90deg, #6b4423, #a56a35, #6b4423);
    border-radius: 3px;
    margin-top: -4px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.4);
    position: relative;
    z-index: 1;
  }

  .result-icon {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%) scale(0);
    width: 110px;
    height: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3;
    pointer-events: none;
  }

  .result-icon.show {
    animation: pop-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  @keyframes pop-in {
    0% { transform: translateX(-50%) scale(0) rotate(-20deg); opacity: 0; }
    60% { transform: translateX(-50%) scale(1.2) rotate(6deg); opacity: 1; }
    100% { transform: translateX(-50%) scale(1) rotate(0deg); opacity: 1; }
  }

  .score-badge {
    border-radius: 50%;
    width: 90px;
    height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bangers', cursive;
    font-size: 2.1rem;
    letter-spacing: 1px;
    color: #fff;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
    box-shadow: 0 0 0 4px #ffffff55, 0 6px 14px rgba(0,0,0,0.4);
  }

  .target-face.knocked {
    animation: tip-over 0.55s ease-in forwards;
  }

  @keyframes tip-over {
    0% { transform: rotate(0deg) translateY(0); opacity: 1; }
    60% { transform: rotate(80deg) translateY(10px); opacity: 1; }
    100% { transform: rotate(95deg) translateY(30px); opacity: 0; }
  }

  .confetti-layer {
    position: absolute;
    top: 55px;
    left: 50%;
    width: 0;
    height: 0;
    z-index: 5;
    pointer-events: none;
  }

  .confetto {
    position: absolute;
    width: 8px;
    height: 14px;
    top: 0;
    left: 0;
    opacity: 1;
    animation: burst 0.75s ease-out forwards;
  }

  @keyframes burst {
    to {
      transform: translate(var(--dx), var(--dy)) rotate(var(--rot));
      opacity: 0;
    }
  }

  .wheel-wrap {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 110px;
    height: 110px;
    z-index: 6;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }

  .wheel-wrap.spinning {
    opacity: 1;
  }

  .wheel-pointer {
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 12px solid transparent;
    border-right: 12px solid transparent;
    border-top: 20px solid var(--gold);
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.6));
    z-index: 7;
    transition: transform 0.15s ease;
  }

  .wheel-pointer.landed {
    animation: pointer-pulse 0.5s ease-in-out;
  }

  @keyframes pointer-pulse {
    0%, 100% { transform: translateX(-50%) scale(1); }
    50% { transform: translateX(-50%) scale(1.5); }
  }

  .wheel {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 4px solid #17263a;
    box-shadow: 0 6px 10px rgba(0,0,0,0.4);
    background: conic-gradient(
      var(--red) 0deg 72deg,
      var(--orange) 72deg 144deg,
      var(--gold) 144deg 216deg,
      var(--green) 216deg 288deg,
      var(--blue) 288deg 360deg
    );
    transform: rotate(0deg);
    transition: box-shadow 0.2s ease;
  }

  .wheel.spin {
    transition: transform 2s cubic-bezier(0.22, 0.68, 0.35, 1), box-shadow 0.2s ease;
  }

  .wheel-wrap.landed .wheel {
    box-shadow: 0 0 0 6px var(--landed-color, #fff), 0 6px 14px rgba(0,0,0,0.5);
  }

  .footer-note {
    margin-top: 1.4rem;
    text-align: center;
    color: #fff7e6;
    font-weight: 600;
    font-size: 1.15rem;
    background: rgba(28, 12, 8, 0.78);
    padding: 0.9rem 1.4rem;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
    max-width: 720px;
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 5, 5, 0.72);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 1rem;
  }

  .overlay.visible {
    display: flex;
    animation: fade-in 0.3s ease-out;
  }

  @keyframes fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .overlay-card {
    background: linear-gradient(160deg, #fff7e6, #ffe6a8);
    border: 8px solid var(--deep-red);
    border-radius: 16px;
    padding: 2rem 1.8rem;
    max-width: 480px;
    width: 100%;
    text-align: center;
    box-shadow: 0 18px 30px rgba(0,0,0,0.5);
    animation: pop-card 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes pop-card {
    from { transform: scale(0.7); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .overlay-card p {
    font-size: clamp(1.1rem, 3vw, 1.4rem);
    font-weight: 700;
    color: var(--deep-red);
    margin: 0 0 1.4rem;
    line-height: 1.4;
  }

  #overlayMessage.win-message {
    font-family: 'Bangers', cursive;
    letter-spacing: 1px;
    font-size: clamp(2rem, 6vw, 3rem);
    color: var(--green);
    text-shadow: 2px 2px 0 #fff, 4px 4px 0 rgba(0,0,0,0.15);
    animation: message-bounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  #overlayAverage {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--deep-red);
    margin: -0.8rem 0 1.4rem;
  }

  .overlay-note {
    font-size: 0.9rem;
    font-style: italic;
    font-weight: 600;
    color: var(--deep-red);
    opacity: 0.85;
    margin: -0.9rem 0 1.4rem;
    display: none;
  }

  .overlay-note.show {
    display: block;
  }

  @keyframes message-bounce {
    0% { transform: scale(0.4); opacity: 0; }
    60% { transform: scale(1.2); opacity: 1; }
    100% { transform: scale(1); }
  }

  .win-confetti-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 60;
    overflow: hidden;
  }

  .win-confetto {
    position: absolute;
    top: -20px;
    width: 10px;
    height: 16px;
    opacity: 0.95;
    animation: confetti-fall linear forwards;
  }

  @keyframes confetti-fall {
    to {
      transform: translateY(110vh) translateX(var(--drift)) rotate(var(--rot));
      opacity: 0.85;
    }
  }

  #playAgainBtn {
    font-family: 'Bangers', cursive;
    letter-spacing: 1px;
    font-size: 1.3rem;
    background: var(--red);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 0.7rem 1.8rem;
    cursor: pointer;
    box-shadow: 0 6px 0 var(--deep-red);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }

  #playAgainBtn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 var(--deep-red);
  }

  #playAgainBtn:hover {
    filter: brightness(1.08);
  }
</style>
</head>
<body>
  <div class="carnival-bg">
    <div class="lights" id="lights"></div>

    <header class="sign">
      <h1>SPIN TO WIN!! SCORE AN AVERAGE ABOVE +1 TO WIN!</h1>
      <p class="subtitle">Six spins, one average! Will you win?</p>
    </header>

    <main class="booth">
      <div class="targets-row" id="targetsRow"></div>
    </main>

    <p class="footer-note">Each slice has equal (20%) odds. Scores from -1 to +3.</p>
  </div>

  <div class="overlay" id="overlay">
    <div class="overlay-card">
      <p id="overlayMessage"></p>
      <p id="overlayAverage"></p>
      <p id="overlayNote" class="overlay-note"></p>
      <button id="playAgainBtn">Play Again</button>
    </div>
  </div>

<script>
  const TARGET_COUNT = 6;
  const WIN_THRESHOLD = 1;
  const CONFETTI_COLORS = ['#ffce3a', '#e0222b', '#57c1ff', '#2fae5b', '#ffffff'];

  const SLICES = [
    { value: -1, color: '#d4232c' },
    { value: 0,  color: '#ff8c1a' },
    { value: 1,  color: '#ffce3a' },
    { value: 2,  color: '#2fae5b' },
    { value: 3,  color: '#2f7fe0' },
  ];
  const SLICE_DEGREES = 360 / SLICES.length;
  const EDGE_MARGIN = 6;

  const targetsRow = document.getElementById('targetsRow');
  const overlay = document.getElementById('overlay');
  const overlayMessage = document.getElementById('overlayMessage');
  const overlayAverage = document.getElementById('overlayAverage');
  const overlayNote = document.getElementById('overlayNote');
  const playAgainBtn = document.getElementById('playAgainBtn');
  const lights = document.getElementById('lights');

  let resolvedCount = 0;
  let scores = [];

  for (let i = 0; i < 14; i++) {
    const bulb = document.createElement('span');
    lights.appendChild(bulb);
  }

  function buildTarget(index) {
    const target = document.createElement('div');
    target.className = 'target';
    target.dataset.index = index;

    const confetti = document.createElement('div');
    confetti.className = 'confetti-layer';

    const face = document.createElement('div');
    face.className = 'target-face';

    const resultIcon = document.createElement('div');
    resultIcon.className = 'result-icon';

    const wheelWrap = document.createElement('div');
    wheelWrap.className = 'wheel-wrap';
    const wheelPointer = document.createElement('div');
    wheelPointer.className = 'wheel-pointer';
    const wheel = document.createElement('div');
    wheel.className = 'wheel';
    wheelWrap.appendChild(wheelPointer);
    wheelWrap.appendChild(wheel);

    const stand = document.createElement('div');
    stand.className = 'stand';

    target.appendChild(confetti);
    target.appendChild(face);
    target.appendChild(resultIcon);
    target.appendChild(wheelWrap);
    target.appendChild(stand);

    target.addEventListener('click', () => handleClick(target, face, resultIcon, confetti, wheelWrap, wheel, wheelPointer));

    return target;
  }

  function handleClick(target, face, resultIcon, confetti, wheelWrap, wheel, wheelPointer) {
    if (target.classList.contains('resolved')) return;
    target.classList.add('resolved');

    const sliceIndex = Math.floor(Math.random() * SLICES.length);
    const slice = SLICES[sliceIndex];

    spinWheel(wheelWrap, wheel, wheelPointer, sliceIndex, slice.color, () => {
      scores.push(slice.value);
      celebrate(face, resultIcon, confetti, slice);

      resolvedCount++;
      if (resolvedCount === TARGET_COUNT) {
        setTimeout(showResult, 800);
      }
    });
  }

  const LANDED_PAUSE = 550;

  function spinWheel(wheelWrap, wheel, wheelPointer, sliceIndex, color, onDone) {
    wheelWrap.classList.add('spinning');

    // Pick a landing angle inside the chosen slice, with a margin from its edges.
    const sliceStart = sliceIndex * SLICE_DEGREES;
    const landingAngle = sliceStart + EDGE_MARGIN + Math.random() * (SLICE_DEGREES - 2 * EDGE_MARGIN);

    const extraSpins = 5;
    const rotation = extraSpins * 360 + ((360 - landingAngle) % 360);

    requestAnimationFrame(() => {
      wheel.classList.add('spin');
      wheel.style.transform = `rotate(${rotation}deg)`;
    });

    setTimeout(() => {
      // Hold on the landed result — glowing ring + pointer pulse — before the target reacts.
      wheelWrap.style.setProperty('--landed-color', color);
      wheelWrap.classList.add('landed');
      wheelPointer.classList.add('landed');
    }, 2000);

    setTimeout(() => {
      wheelWrap.classList.remove('spinning');
      onDone();
    }, 2000 + LANDED_PAUSE);
  }

  function celebrate(face, resultIcon, confetti, slice) {
    face.classList.add('knocked');
    spawnConfetti(confetti);

    setTimeout(() => {
      const badge = document.createElement('div');
      badge.className = 'score-badge';
      badge.style.background = slice.color;
      badge.textContent = slice.value > 0 ? `+${slice.value}` : `${slice.value}`;
      resultIcon.appendChild(badge);
      resultIcon.classList.add('show');
    }, 350);
  }

  function spawnConfetti(container) {
    for (let i = 0; i < 16; i++) {
      const piece = document.createElement('div');
      piece.className = 'confetto';
      const angle = Math.random() * Math.PI * 2;
      const distance = 50 + Math.random() * 60;
      const dx = Math.cos(angle) * distance;
      const dy = Math.sin(angle) * distance - 20;
      const rot = (Math.random() * 720 - 360) + 'deg';
      piece.style.setProperty('--dx', dx + 'px');
      piece.style.setProperty('--dy', dy + 'px');
      piece.style.setProperty('--rot', rot);
      piece.style.background = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
      piece.style.animationDelay = (Math.random() * 0.1) + 's';
      container.appendChild(piece);
      setTimeout(() => piece.remove(), 900);
    }
  }

  function showResult() {
    const average = scores.reduce((sum, v) => sum + v, 0) / scores.length;
    const isWinner = average >= WIN_THRESHOLD;
    const displayAverage = average.toFixed(2).replace(/^(-?)(\d)/, (m, sign, d) => (average > 0 ? '+' : '') + m);

    overlayMessage.textContent = isWinner ? "Winner!" : "Try again!";
    overlayMessage.classList.toggle('win-message', isWinner);
    overlayAverage.textContent = `Average score: ${displayAverage}`;

    const hadMiss = isWinner && scores.includes(-1);
    overlayNote.textContent = hadMiss ? "This would not have been marked a win using the previous method." : "";
    overlayNote.classList.toggle('show', hadMiss);

    overlay.classList.add('visible');

    if (isWinner) {
      spawnWinConfetti();
    }
  }

  function spawnWinConfetti() {
    const layer = document.createElement('div');
    layer.className = 'win-confetti-layer';
    document.body.appendChild(layer);

    for (let i = 0; i < 80; i++) {
      const piece = document.createElement('div');
      piece.className = 'win-confetto';
      piece.style.left = Math.random() * 100 + 'vw';
      piece.style.background = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
      piece.style.animationDuration = (2.5 + Math.random() * 2) + 's';
      piece.style.animationDelay = (Math.random() * 0.6) + 's';
      piece.style.setProperty('--drift', (Math.random() * 200 - 100) + 'px');
      piece.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
      layer.appendChild(piece);
    }

    setTimeout(() => layer.remove(), 5000);
  }

  playAgainBtn.addEventListener('click', () => {
    location.reload();
  });

  for (let i = 0; i < TARGET_COUNT; i++) {
    targetsRow.appendChild(buildTarget(i));
  }
</script>
</body>
</html>
